<!doctype html>
<html lang="hu" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Családi terv 2027</title>
<style>
:root{--bg:#F6F5FB;--card:#FFFFFF;--ink:#1C1A2E;--mut:#5E5A78;--line:#E3E0EF;--acc:#4C3DD6;--tab:#E6E3F2;--we:#EEEBF8;
--hol:#F8D7E3;--holI:#A0284F;--brk:#FFF1BF;--brkI:#7A5A00;--hot:#F7D3F7;--hotI:#7A1A7A;--rs:#CDEBDB;--rsI:#1E6B45;--ks:#F4D0D0;--ksI:#8A2424;
--cK:#2F6FE0;--cP:#D9661A;--cO:#23874F;--cF:#4C3DD6;--sK:#DCE7FB;--sP:#FBE3D2;--sO:#D7EEDF;--sF:#E6E1FB;--shade:rgba(20,18,35,.45)}
:root[data-theme="erdo"]{--bg:#EEF4EC;--mut:#4F6654;--ink:#17261B;--acc:#2E7D4F;--tab:#DCE8D8;--we:#E2EDDF;--line:#D6E3D2;--sF:#DDEFE2;--cF:#2E7D4F}
:root[data-theme="tenger"]{--bg:#EAF3F8;--mut:#4A6476;--ink:#10232F;--acc:#1F6FA8;--tab:#D6E6F0;--we:#DEEBF3;--line:#D3E2EC;--sF:#DCEAF5;--cF:#1F6FA8}
:root[data-theme="nap"]{--bg:#FFF3EA;--mut:#6E5244;--ink:#2B1A12;--acc:#C24A22;--tab:#F6E0D2;--we:#FBE8DC;--line:#F0DCCF;--sF:#FBE1D6;--cF:#C24A22}
:root[data-theme="ejj"]{--bg:#15131F;--card:#221F31;--ink:#F1EFFA;--mut:#AAA5C6;--line:#34304A;--acc:#9C8CFF;--tab:#2A2740;--we:#1B1928;
--hol:#4A2032;--holI:#FFB3CC;--brk:#3E3410;--brkI:#FFE08A;--hot:#40193F;--hotI:#F6B6F6;--rs:#173A29;--rsI:#9BE3BC;--ks:#432020;--ksI:#FFB4B4;
--cK:#6EA0FF;--cP:#FF9C5B;--cO:#5BCB8A;--cF:#9C8CFF;--sK:#1E2C4A;--sP:#4A2C1A;--sO:#183A28;--sF:#2C2650;--shade:rgba(0,0,0,.6)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#15131F;--card:#221F31;--ink:#F1EFFA;--mut:#AAA5C6;--line:#34304A;--acc:#9C8CFF;--tab:#2A2740;--we:#1B1928;
--hol:#4A2032;--holI:#FFB3CC;--brk:#3E3410;--brkI:#FFE08A;--hot:#40193F;--hotI:#F6B6F6;--rs:#173A29;--rsI:#9BE3BC;--ks:#432020;--ksI:#FFB4B4;
--cK:#6EA0FF;--cP:#FF9C5B;--cO:#5BCB8A;--cF:#9C8CFF;--sK:#1E2C4A;--sP:#4A2C1A;--sO:#183A28;--sF:#2C2650;--shade:rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .t{display:flex;flex-direction:column;gap:2px}.top .t span{font-size:13px;font-weight:600;color:var(--mut)}.top .t b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.ib svg{stroke:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--tab);border-radius:14px;padding:4px}
.tabs button{height:40px;border:0;border-radius:11px;background:transparent;color:var(--mut);font-weight:600;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .c{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}.nav .c b{font-size:17px}.nav .c span{font-size:13px;color:var(--mut)}
.ma{border:0;background:none;color:var(--acc);font-weight:700;font-size:13px;padding:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.card{display:flex;gap:10px;border-radius:18px;padding:12px 14px 12px 8px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%}
.card.we{background:var(--we)}.card.today{box-shadow:0 0 0 2px var(--acc) inset;border-color:transparent}
.dcol{display:flex;flex-direction:column;align-items:center;width:46px;flex:none;padding-top:2px}
.dcol span{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase}.dcol b{font-size:24px;font-weight:800;line-height:1.1}
.dcol b.red{color:var(--holI)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-hol{background:var(--hol);color:var(--holI)}.t-brk{background:var(--brk);color:var(--brkI)}.t-hot{background:var(--hot);color:var(--hotI)}
.t-r{background:var(--rs);color:var(--rsI)}.t-k{background:var(--ks);color:var(--ksI)}.t-wd{background:var(--tab);color:var(--ink)}
.it{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.35;word-break:break-word}.it .dot{margin-top:5px}
.empty{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);background:var(--we);border-radius:8px;padding:6px 8px;word-break:break-word}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mh{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding-bottom:2px}
.mc{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 5px}
.mc.we{background:var(--we)}.mc.brk{background:var(--brk)}.mc.hol{background:var(--hol)}
.mc.sel{border:2px solid var(--acc)}.mc.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.mc .n{font-size:15px;font-weight:600}.mc.hol .n{color:var(--holI)}
.mc .ds{display:flex;gap:2px;min-height:6px}.mc .ds i{width:6px;height:6px;border-radius:50%}
.mc .bar{width:70%;height:4px;border-radius:2px}
.mc.blank{border:0;background:transparent}
.lg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;font-weight:600;color:var(--mut)}.lg span{display:flex;align-items:center;gap:6px}.lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.sect{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sum span{font-size:12px;font-weight:700;color:var(--mut)}.sum b{font-size:22px;font-weight:800}.sum small{font-size:11px;color:var(--mut)}
.yr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ym{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left}
.ym.cur{border:2px solid var(--acc)}.ym b{font-size:14px;font-weight:800}
.yg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.yg span{height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:600}
.flt{display:flex;gap:6px;flex-wrap:wrap}
.flt button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.flt button[aria-pressed="true"]{border:2px solid var(--acc);font-weight:700}
.tbl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch}
.tr{display:grid;text-align:left;border-top:1px solid var(--line);min-width:max-content}
.tr.h{position:sticky;top:0;z-index:2;background:var(--acc);color:#fff;font-size:12px;font-weight:700;border-top:0}
.tr.h>span{background:var(--acc)}
.tr>span{padding:8px;font-size:13px;line-height:1.3;word-break:break-word}
.tr>.dc{position:sticky;left:0;z-index:1;display:flex;flex-direction:column;gap:1px;box-shadow:1px 0 0 var(--line)}
.tr.h>.dc{z-index:3}
.tr .dc small{font-size:11px;color:var(--mut)}.tr .dc .hl{font-size:10px;font-weight:700;color:var(--holI)}
.tr.today{box-shadow:inset 0 0 0 2px var(--acc)}
.tr .c{text-align:center;font-weight:700}
.sheet{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.pane{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ph b{font-size:20px;font-weight:800}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mut)}
label.f>span{display:flex;align-items:center;gap:6px}
input.tx,textarea.tx{width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:500 16px inherit;font-family:inherit}
textarea.tx{min-height:72px;resize:none}
.seg{display:grid;gap:3px;background:var(--tab);border-radius:12px;padding:3px}
.seg button{height:40px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.go{height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:16px}
.go:disabled{opacity:.6}
.small{font-size:12px;color:var(--mut);text-align:center}
.th{display:flex;flex-direction:column;gap:8px}
.th button{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;text-align:left}
.th button[aria-pressed="true"]{border:2px solid var(--acc)}
.th .sw{display:flex;gap:4px}.th .sw i{width:22px;height:22px;border-radius:7px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.th b{display:block;font-size:15px}.th small{font-size:12px;color:var(--mut)}
.msg{padding:40px 16px;text-align:center;color:var(--mut);font-size:15px}
.card,.tr{cursor:pointer}.card:focus-visible,.tr:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--acc);font-weight:700;text-decoration:underline;text-underline-offset:2px;word-break:normal;overflow-wrap:anywhere}
.lnk svg{stroke:currentColor;flex:none}
.sec{height:48px;border-radius:14px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:800;font-size:15px}
.sec:disabled,.go:disabled{opacity:.5}
.cf{display:flex;flex-wrap:wrap;gap:6px}
.cf button{min-height:38px;max-width:100%;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf button[aria-pressed="true"]{border:2px solid var(--acc);font-weight:800}
.pk .mc{height:44px;justify-content:center}
.pk .mc[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}.pk .mc[aria-pressed="true"] .n{color:#fff;font-weight:800}
.pk .mc.src{opacity:.35}
.fl{display:flex;gap:6px;align-items:stretch}.fl .tx{flex:1;min-width:0}
.lb{width:44px;min-height:44px;flex:none;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--mut)}
.lb svg{stroke:currentColor}.lb[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--card)}
.ui{font-size:14px!important;min-height:40px!important;border-style:dashed!important}
.wk{display:flex;flex-direction:column;gap:10px}
@media (min-width:640px){
 .wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:stretch}
 .yr{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
 .mc{height:72px}.pk .mc{height:48px}
 .tabs,.flt,.nav,.legend,.sum{max-width:900px;width:100%;margin-left:auto;margin-right:auto}
 .box:not(.pk){max-width:900px;width:100%;margin-left:auto;margin-right:auto}
}
@media (orientation:landscape) and (max-height:500px){.tbl{max-height:none}}
.pane>*{flex-shrink:0}
.pane .go{min-height:58px;font-size:18px;border-radius:16px}
.pane .sec{min-height:54px;font-size:17px;border-radius:16px}
.pane input.tx,.pane textarea.tx{font-size:19px;min-height:52px;padding:12px 14px;line-height:1.3}
.pane textarea.tx{min-height:84px}
.pane .ui{font-size:16px!important;min-height:46px!important}
.pane .lb{width:52px;min-height:52px}
.pane label.f,.pane .f>label,.pane .f>span{font-size:15px!important}
.pane .seg button{height:46px;font-size:16px}
.hdr{position:sticky;top:0;z-index:10;background:var(--bg);margin:-16px -16px 0;padding:12px 16px 10px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .2s}
.hdr.sh{box-shadow:0 6px 12px -8px rgba(0,0,0,.25)}
#sub{display:flex;flex-direction:column;gap:10px}#sub:empty{display:none}
.dd{position:relative;flex:none;display:flex}
.dd select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.le{display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;font-size:16px}
.lr span{flex:1;min-width:0;overflow-wrap:anywhere}.lr small{color:var(--mut);font-size:12px;white-space:nowrap}
.lr button{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--mut);font-size:20px;flex:none}
.lr.add{background:transparent;border-style:dashed}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
 <div class="hdr" id="hdr">
  <div class="top">
    <div class="t"><span>Családi terv</span><b id="yr">2027</b></div>
    <div style="display:flex;gap:8px">
      <button class="ib" id="bRef" aria-label="Frissítés"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="ib" id="bTheme" aria-label="Téma"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="tabs" role="group" aria-label="Nézet">
    <button data-v="het">Hét</button><button data-v="ho">Hónap</button><button data-v="ev">Év</button><button data-v="sor">Sorok</button>
  </div>
  <div id="sub"></div>
 </div>
  <div id="main"><div class="msg">Betöltés…</div></div>
  <p class="small">Felület v9 · 2026.11.08.</p>
</div>

<div class="sheet" id="sheet" hidden><div class="pane" id="pane"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var HN=['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
var HNB=HN.map(function(s){return s.charAt(0).toUpperCase()+s.slice(1)});
var NN=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
var NR=['V','H','K','Sze','Cs','P','Szo'];
var WHO=[['k','Kristóf','K'],['p','Panna','P'],['o','Oli','O'],['f','Család','F']];
var THEMES=[['auto','Automatikus','A telefon világos/sötét beállítását követi',['#F6F5FB','#15131F','#4C3DD6','#9C8CFF']],
 ['lev','Levendula','Világos, lila',['#F6F5FB','#FFFFFF','#4C3DD6','#1C1A2E']],
 ['ejj','Éjszaka','Sötét, kíméli a szemet',['#15131F','#221F31','#9C8CFF','#F1EFFA']],
 ['erdo','Erdő','Nyugodt zöldek',['#EEF4EC','#FFFFFF','#2E7D4F','#17261B']],
 ['tenger','Tenger','Hűvös kékek',['#EAF3F8','#FFFFFF','#1F6FA8','#10232F']],
 ['nap','Naplemente','Meleg, vidám színek',['#FFF3EA','#FFFFFF','#C24A22','#2B1A12']]];

var S={data:null,map:{},view:'het',cur:null,flt:'all',today:null};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pd(k){var a=k.split('-');return new Date(+a[0],a[1]-1,+a[2])}
function kd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function add(k,n){var d=pd(k);d.setDate(d.getDate()+n);return kd(d)}
function wd(k){return (pd(k).getDay()+6)%7}
function isoW(k){var d=pd(k);d.setDate(d.getDate()+3-(d.getDay()+6)%7);var j=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-j)/864e5-3+(j.getDay()+6)%7)/7)}
var LI='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
function lk(s){return esc(s).replace(/https?:\/\/[^\s<]+/g,function(u){var h=u.replace(/^https?:\/\/(www\.)?/,'').split(/[\/?#]/)[0];return '<a class="lnk" href="'+u+'" target="_blank" rel="noopener">'+LI+h+'</a>'})}
function tl(x,key){var t=x[key],u=x.L&&x.L[key];if(!u)return lk(t);return '<a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener">'+LI+esc(t||u.replace(/^https?:\/\/(www\.)?/,'').split(/[\/?#]/)[0])+'</a>'}
function freq(key){var m={};S.data.days.forEach(function(x){var t=String(x[key]||'').trim();if(!t)return;var k=t.toLowerCase();if(!m[k])m[k]={t:t,n:0,u:''};m[k].n++;if(x.L&&x.L[key])m[k].u=x.L[key]});return m}
function sugg(key){var m=freq(key),list=(S.data.lists&&S.data.lists[key])||[],inL={};
  var saved=list.map(function(t){var f=m[t.toLowerCase()]||{};inL[t.toLowerCase()]=1;return {t:t,n:f.n||0,u:f.u||''}}).sort(function(a,b){return b.n-a.n});

  h+='<span class="small" style="text-align:left">A kijelölt mezők felülírják a célnapokon lévőt, a többi mező marad.</span>';
  h+='<span class="sect">Melyik napokra?</span><div class="nav"><button class="ib" data-cm="-1" aria-label="Előző hónap">'+chev(1)+'</button><div class="c"><b>'+y+'. '+HN[m]+'</b></div><button class="ib" data-cm="1" aria-label="Következő hónap">'+chev(0)+'</button></div>';
  var first=new Date(y,m,1),len=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7;
  h+='<div class="box pk"><div class="mgrid">'+['H','K','Sze','Cs','P','Szo','V'].map(function(q){return '<span class="mh">'+q+'</span>'}).join('');
  for(var i=0;i<lead;i++)h+='<span class="mc blank"></span>';
  for(var d=1;d<=len;d++){var k=kd(new Date(y,m,d)),x=S.map[k],w=(lead+d-1)%7;
    if(!x){h+='<span class="mc blank"><span class="n" style="color:var(--mut)">'+d+'</span></span>';continue}
    h+='<button type="button" class="mc'+(w>=5?' we':'')+(k===c.src?' src':'')+'" data-cd="'+k+'" aria-pressed="'+!!c.sel[k]+'"'+(k===c.src?' disabled':'')+' aria-label="'+HN[m]+' '+d+'"><span class="n">'+d+'</span></button>'}
  h+='</div></div>';
  var n=Object.keys(c.sel).length,nf=Object.keys(c.f).filter(function(q){return c.f[q]}).length;
  h+='<button class="go" id="bDoCopy"'+(n&&nf&&!c.busy?'':' disabled')+'>'+(c.busy?c.busy:(n?'Másolás '+n+' napra':'Jelölj ki napokat'))+'</button><button class="sec" id="bBack"'+(c.busy?' disabled':'')+'>Vissza</button>';
  $('pane').innerHTML=h;
}
function doCopy(){
  var c=S.cp,ts=Object.keys(c.sel).sort(),i=0;
  c.busy='Mentés…';renderCopy();
  call('saveDay',[S.map[c.src].row,c.src,c.o]).then(function(r){putDay(r);
    function next(){
      if(i>=ts.length){var n=ts.length;S.cp=null;closeSheet();render();toast('Átmásolva '+n+' napra');return}
      var t=ts[i++],x=S.map[t],b={k:x.k,p:x.p,o:x.o,f:x.f,R:x.R,K:x.K,h:x.h,n:x.n,L:Object.assign({},x.L||{})};
      Object.keys(c.f).forEach(function(q){if(c.f[q]){b[q]=c.o[q];if(c.o.L[q])b.L[q]=c.o.L[q];else delete b.L[q]}});
      c.busy='Másolás… '+i+'/'+ts.length;renderCopy();
      return call('saveDay',[x.row,t,b]).then(function(r){putDay(r);return next()});
    }
    return next();
  }).catch(function(e){c.busy=false;renderCopy();toast('Hiba: '+(e&&e.message||e))});
}
function save(){
  var k=S.cur,x=S.map[k],o=formVals();
  var btn=$('bSave');btn.disabled=true;btn.textContent='Mentés…';
  google.script.run.withSuccessHandler(function(r){
    putDay(r);closeSheet();render();toast('Elmentve a táblázatba');
  }).withFailureHandler(function(e){btn.disabled=false;btn.textContent='Mentés a táblázatba';toast('Hiba: '+(e&&e.message||e))}).saveDay(x.row,k,o);
}
var LW=[['k','Kristóf'],['p','Panna'],['o','Oli'],['f','Család']];
function openLists(ret,tab){
  S.lret=ret||S.lret||null;
  if(!S.data.lists){$('pane').innerHTML='<span class="grab"></span><div class="ph"><b>Mentett listák</b><button class="ib" data-close aria-label="Bezárás">✕</button></div><p>A listák mentéséhez frissíteni kell az Apps Script kódot (Kód.gs). Addig a korábban beírt bejegyzések közül tudsz választani.</p>'+(S.lret?'<button class="sec" id="bLback">Vissza</button>':'');$('sheet').hidden=false;return}
  if(!S.ed)S.ed=JSON.parse(JSON.stringify(S.data.lists));
  S.edTab=tab||S.edTab||'k';renderLists();$('sheet').hidden=false;
}
function renderLists(){
  var key=S.edTab,list=S.ed[key]||[],m=freq(key),inL={};list.forEach(function(t){inL[t.toLowerCase()]=1});
  if(S.lconf){var c=S.lconf,ex=list[c.i];
    $('pane').innerHTML='<span class="grab"></span><div class="ph"><b>Hasonló bejegyzés</b></div><p style="margin:0">Már van a listán egy hasonló:</p><div class="lr"><span><b>'+esc(ex)+'</b></span><small>meglévő</small></div><div class="lr"><span><b>'+esc(c.t)+'</b></span><small>új</small></div><p style="margin:0;color:var(--mut);font-size:14px">Mi legyen?</p>'+
    '<button class="sec" data-lc="keep">Egyesítés: „'+esc(ex)+'” marad</button><button class="sec" data-lc="new">Egyesítés: „'+esc(c.t)+'” legyen</button><button class="sec" data-lc="both">Mindkettő kell</button>'+((S.lq&&S.lq.length)?'<span class="small">Még '+S.lq.length+' bejegyzés vár a felvételre.</span>':'');return}
  var h='<span class="grab"></span><div class="ph"><div style="display:flex;flex-direction:column;gap:4px"><b>Mentett listák</b><span style="font-size:13px;color:var(--mut)">A táblázat „Listák” lapján is szerkesztheted.</span></div><button class="ib" data-close aria-label="Bezárás"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
  h+='<div class="seg" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+LW.map(function(w){return '<button type="button" data-lt2="'+w[0]+'" aria-pressed="'+(w[0]===key)+'">'+w[1]+'</button>'}).join('')+'</div>';
  h+='<div class="le">'+(list.length?list.map(function(t,i){var n=(m[t.toLowerCase()]||{}).n||0;return '<div class="lr"><span>'+esc(t)+'</span><small>'+(n?n+'×':'')+'</small><button type="button" data-ld="'+i+'" aria-label="Törlés">✕</button></div>'}).join(''):'<p class="empty" style="margin:0">Még üres a lista.</p>');
  h+='<div class="lr add"><input class="tx" id="lnew" placeholder="Új bejegyzés…" style="border:0;background:transparent;min-height:40px;padding:0;font-size:16px"><button type="button" id="bLadd" aria-label="Hozzáadás" style="color:var(--acc);font-weight:800">+</button></div></div>';
  var oth=Object.keys(m).filter(function(k){return !inL[k]&&!simOf(m[k].t,list)}).map(function(k){return m[k]}).sort(function(a,b){return b.n-a.n}).slice(0,12);
  if(oth.length)h+='<span class="sect">Eddig beírtak – koppints a felvételhez</span><button type="button" class="sec" id="bLall" style="min-height:44px">Mind felvétele a listára ('+Object.keys(m).filter(function(k){return !inL[k]&&!simOf(m[k].t,list)}).length+')</button><div class="cf">'+oth.map(function(x){return '<button type="button" data-la="'+esc(x.t)+'">+ '+esc(x.t)+' ('+x.n+'×)</button>'}).join('')+'</div>';
  h+='<button class="go" id="bLsave">Listák mentése</button>'+(S.lret?'<button class="sec" id="bLback">Vissza a naphoz</button>':'');
  $('pane').innerHTML=h;
}
function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=n;i++)d[i]=i;for(i=1;i<=m;i++){var pr=d[0];d[0]=i;for(j=1;j<=n;j++){var t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,pr+(a[i-1]===b[j-1]?0:1));pr=t}}return d[n]}
function simOf(t,l){var a=nz(t);if(!a)return null;for(var i=0;i<l.length;i++){var b=nz(l[i]);if(!b)continue;if(a===b)return {i:i,same:true};
  if((a.length>=4&&b.indexOf(a)>=0)||(b.length>=4&&a.indexOf(b)>=0)||lev(a,b)/Math.max(a.length,b.length)<=0.2)return {i:i}}return null}
function lNext(){var l=S.ed[S.edTab]=S.ed[S.edTab]||[];
  while(S.lq&&S.lq.length){var t=String(S.lq.shift()||'').trim();if(!t)continue;
    if(l.some(function(x){return x===t}))continue;
    var sm=simOf(t,l);if(sm){S.lconf={t:t,i:sm.i};renderLists();return}
    l.push(t)}
  S.lconf=null;renderLists()}
function lAdd(t){S.lq=[t];lNext()}
function lBack(){var r=S.lret;S.lret=null;S.ed=null;if(r)openDay(r.k,r.o);else closeSheet()}
function openTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var h='<span class="grab"></span><div class="ph"><b>Téma</b><button class="ib" data-close aria-label="Bezárás"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><span class="small" style="text-align:left">Csak ezen a telefonon változik.</span><div class="th">';
  THEMES.forEach(function(t){h+='<button data-theme-pick="'+t[0]+'" aria-pressed="'+(cur===t[0])+'"><span><b>'+t[1]+'</b><small>'+t[2]+'</small></span><span class="sw">'+t[3].map(function(c){return '<i style="background:'+c+'"></i>'}).join('')+'</span></button>'});
  $('pane').innerHTML=h+'</div>';$('sheet').hidden=false;
}

document.addEventListener('click',function(e){
  if(e.target.closest('a.lnk'))return;
  var t=e.target.closest('button,[data-day]');
  if(e.target.id==='sheet'){if(!(S.cp&&S.cp.busy))closeSheet();return}
  if(!t||t.disabled)return;
  if(t.dataset.v){S.view=t.dataset.v;ls('nt_view',S.view);render();window.scrollTo(0,0);return}
  if(t.dataset.mv){var n=add(S.cur,+t.dataset.mv);if(S.map[n]||S.map[add(n,-wd(n))]||S.map[add(n,6-wd(n))]){S.cur=S.map[n]?n:(+t.dataset.mv>0?add(n,-wd(n)):add(n,6-wd(n)));render()}return}
  if(t.dataset.mm){var c=pd(S.cur),m=new Date(c.getFullYear(),c.getMonth()+(+t.dataset.mm),1),k=kd(m);if(S.map[k]){S.cur=k;render()}return}
  if(t.dataset.goto){S.cur=S.today;render();return}
  if(t.dataset.sel){if(S.cur===t.dataset.sel){openDay(S.cur)}else{S.cur=t.dataset.sel;render()}return}
  if(t.dataset.day){openDay(t.dataset.day);return}
  if(t.dataset.month!=null){S.cur=t.dataset.month+'-01';S.view='ho';ls('nt_view','ho');render();window.scrollTo(0,0);return}
  if(t.dataset.f){S.flt=t.dataset.f;render();return}
  if(t.hasAttribute('data-close')){closeSheet();return}
  if(t.dataset.val!=null){t.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b===t)});return}
  if(t.id==='bSave'){save();return}
  if(t.id==='bCopy'){openCopy();return}
  if(t.dataset.lt2){S.edTab=t.dataset.lt2;renderLists();return}
  if(t.dataset.ld!=null){S.ed[S.edTab].splice(+t.dataset.ld,1);renderLists();return}
  if(t.dataset.la!=null){lAdd(t.dataset.la);return}
  if(t.id==='bLadd'){lAdd($('lnew').value);return}
  if(t.id==='bLall'){var mm=freq(S.edTab);S.lq=Object.keys(mm).map(function(k){return mm[k]}).sort(function(a,b){return b.n-a.n}).map(function(x){return x.t});lNext();return}
  if(t.dataset.lc){var c=S.lconf,l=S.ed[S.edTab];if(t.dataset.lc==='new')l[c.i]=c.t;else if(t.dataset.lc==='both')l.push(c.t);S.lconf=null;lNext();return}
  if(t.id==='bLback'){lBack();return}
  if(t.id==='bLsave'){t.disabled=true;t.textContent='Mentés…';call('saveLists',[S.ed]).then(function(l){S.data.lists=l;toast('Listák elmentve');lBack()}).catch(function(e){t.disabled=false;t.textContent='Listák mentése';toast('Hiba: '+(e&&e.message||e))});return}
  if(t.dataset.lt){var ui=$('pane').querySelector('[data-u="'+t.dataset.lt+'"]');var on=ui.hidden;ui.hidden=!on;t.setAttribute('aria-pressed',on);if(on)ui.focus();return}
  if(t.id==='bBack'){var c=S.cp;S.cp=null;openDay(c.src,c.o);return}
  if(t.id==='bDoCopy'){doCopy();return}
  if(t.dataset.cf){S.cp.f[t.dataset.cf]=!S.cp.f[t.dataset.cf];renderCopy();return}
  if(t.dataset.cd){if(S.cp.sel[t.dataset.cd])delete S.cp.sel[t.dataset.cd];else S.cp.sel[t.dataset.cd]=1;renderCopy();return}
  if(t.dataset.cm){var cm=pd(S.cp.m+'-01');cm.setMonth(cm.getMonth()+(+t.dataset.cm));var mk=kd(cm).slice(0,7);if(S.data.days.some(function(z){return z.d.slice(0,7)===mk})){S.cp.m=mk;renderCopy()}return}
  if(t.dataset.themePick){setTheme(t.dataset.themePick);openTheme();return}
  if(t.id==='bTheme'){openTheme();return}
  if(t.id==='bRef'){toast('Frissítés…');load();return}
});
document.addEventListener('change',function(e){var sel=e.target;if(!sel.dataset||!sel.dataset.dd)return;var key=sel.dataset.dd,v=sel.value;sel.value='';if(!v)return;
  if(v==='__edit'){var ret={k:S.cur,o:formVals()};S.ed=null;openLists(ret,key);return}
  var g=S.dd[key],it=(v[0]==='s'?g.saved:g.others)[+v.slice(2)];if(!it)return;
  var inp=$('pane').querySelector('[data-k="'+key+'"]');inp.value=it.t;
  if(it.u){var ui=$('pane').querySelector('[data-u="'+key+'"]'),lb=$('pane').querySelector('[data-lt="'+key+'"]');ui.value=it.u;ui.hidden=false;lb.setAttribute('aria-pressed','true')}
});
document.addEventListener('keydown',function(e){if(e.target&&e.target.id==='lnew'&&e.key==='Enter'){e.preventDefault();lAdd(e.target.value);return}var t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.dataset&&t.dataset.day&&t.getAttribute('role')==='button'){e.preventDefault();openDay(t.dataset.day)}});
window.addEventListener('scroll',function(){var h=$('hdr');if(h)h.classList.toggle('sh',window.scrollY>4)},{passive:true});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
load();
})();
</script>
</body>
